# Alembic CLI config (plan: docs/plans/sqlite-alembic-storage-plan.md).
# The app runs `upgrade head` itself on start; use the CLI from the repo root to
# make and apply schema changes:
#   alembic revision --autogenerate --rev-id 0002 -m "describe the change"
#   alembic upgrade head
# The database URL comes from config.toml (migrations/env.py), not from here.

[alembic]
script_location = %(here)s/sillytherin/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
