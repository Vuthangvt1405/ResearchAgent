# ResearchChat settings. Secrets (OPENROUTER_API_KEY) stay in .env.

[openrouter]
base_url = "https://openrouter.ai/api/v1"
# OPENROUTER_MODEL in .env overrides this.
model = "anthropic/claude-sonnet-4.5"

[chat]
system_prompt = "You are ResearchChat, a helpful and concise research assistant."
greeting = "Hi! What would you like to research today?"

[web_search]
# Starting state of the "Web search" switch (only shown if the model supports tools).
enabled = true
# Results returned per search.
max_results = 5
# Most tool rounds (searches and page reads) the model may run for one message.
max_rounds = 25
# Longest page text given to the model; longer pages are cut off.
read_page_max_chars = 8000

[dataset_search]
# Datasets returned per search, merged from Hugging Face, Zenodo and DataCite.
# The tool is behind the same "Web search" switch.
max_results = 8

[thinking]
# Level selected when a chat starts (one of the keys below).
default = "default"

# Thinking effort levels, in the order shown in the settings panel.
# Left side: the level sent to OpenRouter. Allowed keys: default, off,
#   minimal, low, medium, high, xhigh. Remove a line to hide that level.
# Right side: the label shown to the user. Change it to any word you like.
[thinking.levels]
default = "Model default"
off = "Off"
low = "Low"
medium = "Medium"
high = "High"

[datasets]
# Background dataset downloads (dataset_download tool), stored in the
# project's files/datasets/ folder. There is no maximum dataset size.
min_free_disk_mb = 0           # extra disk to always leave free (0 = only what the download needs)
ask_above_mb = 200             # bigger downloads ask Download / Skip first
max_files = 500                # files per download request (count, not size)
parallel_downloads = 2         # downloads running at once, for the whole app
stall_timeout_seconds = 120    # fail when no data arrives for this long

# Notebook workspace: one notebook, Python kernel (in Docker) and files folder
# per project. Needs Docker Desktop running and the kernel image built:
#   docker build -f docker/kernel.Dockerfile -t researchchat-kernel:1 docker
[notebook]
workspaces_dir = "workspaces"
cell_timeout_seconds = 60        # then the cell is interrupted
max_output_chars = 20000         # per cell, text outputs
max_image_kb = 1024              # per image output
kernel_idle_minutes = 30         # stop idle kernels
model_auto_run = true            # safe model code runs without asking
risky_code_needs_approval = true # risky model code always asks first
read_max_chars = 12000           # how much of the notebook the model can read

[notebook.docker]
image = "researchchat-kernel:1"
memory = "2g"
cpus = 2
pids_limit = 256
